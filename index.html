<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ben's Christmas List 🎄</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #08100b;
      color: white;
      overflow-x: hidden;
    }

    /* =========================
       MAIN HOME PAGE
    ========================= */

    .home {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background:
        radial-gradient(circle at top, #2c4435 0%, #111812 48%, #080d0a 100%);
    }

    .home-content {
      width: min(760px, 100%);
      text-align: center;
      position: relative;
      z-index: 3;
      opacity: 0;
      transform: translateY(18px) scale(.98);
    }

    .home.show .home-content {
      animation: revealHome 1.2s ease forwards;
    }

    @keyframes revealHome {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .eyebrow {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c1ccc4;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(50px, 10vw, 95px);
      line-height: .9;
      margin: 12px 0;
      letter-spacing: -4px;
    }

    .subtitle {
      color: #acb7b0;
      font-size: 18px;
      line-height: 1.5;
      margin: 0 auto;
      max-width: 540px;
    }

    .open-button {
      display: inline-block;
      margin-top: 30px;
      padding: 16px 24px;
      border-radius: 15px;
      background: #d7e4da;
      color: #101713;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      transition: .2s;
    }

    .open-button:hover {
      transform: translateY(-3px) scale(1.02);
      opacity: .9;
    }

    /* Christmas lights */

    .lights {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .light {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #eaf2eb;
      box-shadow: 0 0 13px rgba(234, 242, 235, .7);
      animation: blink 1.5s alternate infinite;
    }

    .light:nth-child(2) { animation-delay: .15s; }
    .light:nth-child(3) { animation-delay: .30s; }
    .light:nth-child(4) { animation-delay: .45s; }
    .light:nth-child(5) { animation-delay: .60s; }
    .light:nth-child(6) { animation-delay: .75s; }
    .light:nth-child(7) { animation-delay: .90s; }
    .light:nth-child(8) { animation-delay: 1.05s; }

    @keyframes blink {
      from {
        opacity: .4;
        transform: scale(.88);
      }

      to {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .decorations {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 38px;
      font-size: 48px;
    }

    .decoration {
      animation: float 3.2s ease-in-out infinite;
    }

    .decoration:nth-child(2) {
      animation-delay: .5s;
    }

    .decoration:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }

    /* =========================
       INTRO SCREEN
    ========================= */

    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background:
        radial-gradient(circle at 75% 18%, rgba(255,255,255,.12), transparent 90px),
        linear-gradient(#14271c, #07100a);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro.hide {
      animation: introOut 1.2s ease forwards;
      pointer-events: none;
    }

    @keyframes introOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Moon */

    .moon {
      position: absolute;
      top: 12%;
      right: 12%;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #eef4ef;
      box-shadow: 0 0 35px rgba(238,244,239,.3);
    }

    /* Stars */

    .stars {
      position: absolute;
      inset: 0;
    }

    .star {
      position: absolute;
      color: white;
      opacity: .7;
      animation: twinkle 1.8s alternate infinite;
    }

    .star:nth-child(1) { left: 10%; top: 18%; }
    .star:nth-child(2) { left: 22%; top: 10%; animation-delay: .4s; }
    .star:nth-child(3) { left: 38%; top: 21%; animation-delay: .8s; }
    .star:nth-child(4) { left: 55%; top: 12%; animation-delay: .2s; }
    .star:nth-child(5) { left: 68%; top: 27%; animation-delay: .6s; }
    .star:nth-child(6) { left: 84%; top: 15%; animation-delay: 1s; }

    @keyframes twinkle {
      from {
        opacity: .25;
        transform: scale(.8);
      }

      to {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Mountains */

    .mountains {
      position: absolute;
      bottom: 0;
      left: -5%;
      width: 110%;
      height: 38%;
      background:
        linear-gradient(
          135deg,
          transparent 0 15%,
          #173021 15% 34%,
          transparent 34% 50%,
          #1a3423 50% 74%,
          transparent 74%
        );
      opacity: .95;
    }

    /* Snow ground */

    .snow-ground {
      position: absolute;
      bottom: -20px;
      left: -5%;
      width: 110%;
      height: 20%;
      background: #eef4ef;
      border-radius: 50% 50% 0 0 / 35% 35% 0 0;
    }

    /* Santa */

    .santa {
      position: absolute;
      left: -30%;
      top: 37%;
      z-index: 10;
      white-space: nowrap;
      font-size: clamp(54px, 9vw, 92px);
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.35));

      animation:
        santaRide 4.5s cubic-bezier(.18,.74,.25,1) forwards;
    }

    @keyframes santaRide {

      0% {
        left: -35%;
        top: 42%;
        transform: rotate(-2deg) scale(.85);
      }

      40% {
        top: 34%;
        transform: rotate(1deg) scale(1);
      }

      75% {
        left: 72%;
        top: 28%;
        transform: rotate(2deg) scale(1.05);
      }

      100% {
        left: 125%;
        top: 25%;
        transform: rotate(3deg) scale(1.08);
      }
    }

    /* Blowing snow */

    .snow-wave {
      position: absolute;
      inset: -20%;
      z-index: 20;
      opacity: 0;
      pointer-events: none;

      background:
        radial-gradient(circle at 5% 20%, white 0 2px, transparent 3px),
        radial-gradient(circle at 12% 40%, white 0 3px, transparent 4px),
        radial-gradient(circle at 25% 70%, white 0 2px, transparent 3px),
        radial-gradient(circle at 38% 25%, white 0 3px, transparent 4px),
        radial-gradient(circle at 48% 60%, white 0 2px, transparent 3px),
        radial-gradient(circle at 62% 30%, white 0 3px, transparent 4px),
        radial-gradient(circle at 76% 75%, white 0 2px, transparent 3px),
        radial-gradient(circle at 88% 40%, white 0 3px, transparent 4px);

      background-size:
        160px 120px,
        210px 150px,
        190px 130px,
        240px 170px,
        180px 140px,
        220px 160px,
        170px 120px,
        200px 150px;

      animation: snowBlast 5.2s ease-out .7s forwards;
    }

    @keyframes snowBlast {

      0% {
        opacity: 0;
        transform: translateX(-25%);
      }

      25% {
        opacity: .3;
      }

      55% {
        opacity: .95;
        transform: translateX(5%);
      }

      80% {
        opacity: .55;
      }

      100% {
        opacity: 0;
        transform: translateX(25%);
      }
    }

    /* Intro text */

    .intro-title {
      position: absolute;
      z-index: 15;
      bottom: 17%;
      text-align: center;
      opacity: 0;

      animation: introTitle 1.6s ease 2.3s forwards;
    }

    .intro-title small {
      display: block;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: .75;
    }

    .intro-title strong {
      display: block;
      margin-top: 8px;
      font-size: clamp(28px, 7vw, 52px);
    }

    @keyframes introTitle {
      to {
        opacity: 1;
        transform: translateY(-5px);
      }
    }

    /* Skip button */

    .skip-button {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 50;

      border: 1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.25);
      color: white;
      padding: 9px 12px;
      border-radius: 11px;

      font-weight: bold;
      cursor: pointer;
    }

    .skip-button:hover {
      background: rgba(0,0,0,.4);
    }

    /* Mobile */

    @media (max-width: 600px) {

      .decorations {
        font-size: 40px;
      }

      .santa {
        font-size: 58px;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      .intro {
        display: none;
      }

      .home-content {
        opacity: 1;
        transform: none;
      }

      .light,
      .decoration {
        animation: none;
      }

    }
  </style>
</head>

<body>

  <!-- HOME PAGE -->

  <main class="home" id="home">

    <div class="home-content">

      <div class="lights" aria-hidden="true">
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
      </div>

      <div class="eyebrow">
        🎄 Christmas 2026
      </div>

      <h1>
        BEN'S<br>
        CHRISTMAS LIST
      </h1>

      <p class="subtitle">
        My Christmas wishlist for 2026.
        Tap below to see everything I'm hoping for.
      </p>

      <a
        class="open-button"
        href="./wishlist.html"
      >
        🎁 OPEN MY CHRISTMAS LIST →
      </a>

      <div class="decorations" aria-hidden="true">
        <div class="decoration">🎁</div>
        <div class="decoration">🎄</div>
        <div class="decoration">🎁</div>
      </div>

    </div>

  </main>


  <!-- CHRISTMAS INTRO -->

  <div class="intro" id="intro">

    <button
      class="skip-button"
      id="skipButton"
      type="button"
    >
      Skip Intro
    </button>

    <div class="moon"></div>

    <div class="stars" aria-hidden="true">
      <div class="star">✦</div>
      <div class="star">✦</div>
      <div class="star">✦</div>
      <div class="star">✦</div>
      <div class="star">✦</div>
      <div class="star">✦</div>
    </div>

    <div class="mountains"></div>

    <div class="snow-ground"></div>

    <div class="santa">
      🎅🛷💨
    </div>

    <div class="snow-wave"></div>

    <div class="intro-title">
      <small>A very important delivery</small>
      <strong>Ben's Christmas List</strong>
    </div>

  </div>


  <script>

    const intro = document.getElementById("intro");
    const home = document.getElementById("home");
    const skipButton = document.getElementById("skipButton");

    function revealHome() {
      intro.classList.add("hide");
      home.classList.add("show");
    }

    /* Automatically reveal the home page after the intro */

    setTimeout(revealHome, 5700);

    /* Skip Intro button */

    skipButton.addEventListener("click", revealHome);

  </script>

</body>
</html>
