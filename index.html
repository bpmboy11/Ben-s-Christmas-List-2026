<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ben's Christmas List 🎄</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #101713;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: min(950px, 92%);
      margin: auto;
      padding: 45px 0 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .christmas {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #b8c7bc;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(40px, 8vw, 72px);
      margin: 10px 0;
      line-height: 1;
    }

    .subtitle {
      color: #aeb9b1;
      font-size: 17px;
    }

    .ranges {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 35px;
    }

    .range-button {
      border: 1px solid #34423a;
      background: #18221c;
      color: white;
      padding: 18px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s;
    }

    .range-button:hover {
      transform: translateY(-2px);
      border-color: #b8c7bc;
    }

    .range-button.active {
      background: #d7e4da;
      color: #101713;
      border-color: #d7e4da;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 26px;
    }

    .count {
      color: #9eaaa2;
      font-size: 14px;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .item {
      background: #18221c;
      border: 1px solid #34423a;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: 0.2s;
      overflow: hidden;
    }

    .item:hover {
      transform: translateY(-3px);
      border-color: #68796e;
    }

    .product-image {
      width: 100%;
      height: 240px;
      object-fit: contain;
      background: white;
      border-radius: 15px;
      display: block;
    }

    .item-info {
      padding: 2px 3px 3px;
    }

    .item h3 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .price {
      color: #d7e4da;
      font-weight: bold;
      font-size: 16px;
    }

    .category {
      color: #929e96;
      font-size: 13px;
      margin-top: 5px;
    }

    .view-button {
      display: inline-block;
      margin-top: 13px;
      padding: 11px 15px;
      border-radius: 11px;
      background: #d7e4da;
      color: #101713;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: 0.2s;
    }

    .view-button:hover {
      transform: translateY(-1px);
      opacity: 0.88;
    }

    .footer {
      text-align: center;
      color: #77837b;
      margin-top: 40px;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .ranges {
        grid-template-columns: repeat(2, 1fr);
      }

      .items {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 260px;
      }
    }

    @media (max-width: 400px) {
      .ranges {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="christmas">🎄 Christmas 2026</div>

      <h1>Ben's Christmas List</h1>

      <div class="subtitle">
        Tap a price range to see what I'm looking for.
      </div>
    </div>


    <div class="ranges">

      <button
        class="range-button active"
        onclick="showItems('under50', this)"
      >
        Under $50
      </button>

      <button
        class="range-button"
        onclick="showItems('50to100', this)"
      >
        $50–$100
      </button>

      <button
        class="range-button"
        onclick="showItems('100plus', this)"
      >
        $100+
      </button>

      <button
        class="range-button"
        onclick="showItems('all', this)"
      >
        Everything
      </button>

    </div>


    <div class="section-title">
      <h2 id="title">Under $50</h2>
      <div class="count" id="count"></div>
    </div>


    <div class="items" id="items"></div>


    <div class="footer">
      🎁 Thanks for checking out my Christmas list!
    </div>

  </div>


  <script>

    const gifts = [

      {
        name: "Men's PSD",
        price: "Under $50",
        category: "Clothing",
        image: "PSD.avif",
        link: "https://www.target.com/p/psd-men-39-s-2pk-camo-mode-boxer-briefs-urban-camo-blue-camo/-/A-95218636?preselect=95171322#lnk=sametab"
      },

      {
        name: "Jorts",
        price: "Under $50",
        category: "Clothing",
        image: "Jorts.webp",
        link: "https://www.pacsun.com/pacsun/parker-baggy-jean-shorts-light-blue-tint-0170604890030.html?dwvar_0170604890030_color=510"
      },

      {
        name: "Quarter Zip",
        price: "Under $50",
        category: "Clothing",
        image: "Quarter Zip.jpg",
        link: "https://www.amazon.com/JMIERR-Quarter-Pullover-Sweatshirt-Sweater/dp/B0H74RFN74/"
      },

      {
        name: "adidas Handball Spezial",
        price: "$100+",
        category: "Shoes",
        image: "samba spezial.webp",
        link: "https://www.adidas.com/us/handball-spezial-shoes/KZ6703.html"
      },

      {
        name: "Nike Dunks",
        price: "$100+",
        category: "Shoes",
        image: "Nike Dunks.avif",
        link: "https://www.nike.com/t/dunk-low-retro-mens-shoes-5FQWGR/II7078-200"
      },

      {
        name: "ASICS GEL-KAYANO 14",
        price: "$100+",
        category: "Shoes / Running",
        image: "gel kayano 14.webp",
        link: "https://www.asics.com/us/en-us/gel-kayano-14/p/ANA_1203A537-110.html"
      },

      {
        name: "Birkenstock Bostons",
        price: "$100+",
        category: "Shoes",
        image: "Birkenstock Bostons.webp",
        link: "https://www.dickssportinggoods.com/p/birkenstock-mens-boston-soft-footbed-casual-shoes-20birmbstnsftftbdfot/20birmbstnsftftbdfot?color=Black"
      }

    ];


    function showItems(range, button) {

      const itemsContainer = document.getElementById("items");
      const title = document.getElementById("title");
      const count = document.getElementById("count");

      document.querySelectorAll(".range-button").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      let filteredItems;


      if (range === "all") {

        filteredItems = gifts;
        title.textContent = "Everything";

      }

      else {

        filteredItems = gifts.filter(item => {

          if (range === "under50") {
            return item.price === "Under $50";
          }

          if (range === "50to100") {
            return item.price === "$50–$100";
          }

          if (range === "100plus") {
            return item.price === "$100+";
          }

        });


        if (range === "under50") {
          title.textContent = "Under $50";
        }

        if (range === "50to100") {
          title.textContent = "$50–$100";
        }

        if (range === "100plus") {
          title.textContent = "$100+";
        }

      }


      count.textContent = filteredItems.length + " items";

      itemsContainer.innerHTML = "";


      filteredItems.forEach(item => {

        const card = document.createElement("div");

        card.className = "item";


        card.innerHTML = `

          <img
            src="${encodeURI(item.image)}"
            alt="${item.name}"
            class="product-image"
          >

          <div class="item-info">

            <h3>${item.name}</h3>

            <div class="price">
              ${item.price}
            </div>

            <div class="category">
              ${item.category}
            </div>

            <a
              href="${item.link}"
              target="_blank"
              rel="noopener noreferrer"
              class="view-button"
            >
              View Item →
            </a>

          </div>

        `;

        itemsContainer.appendChild(card);

      });

    }


    showItems(
      "under50",
      document.querySelector(".range-button")
    );

  </script>

</body>
</html>
