<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ben's Christmas List 🎄</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #24382c 0%, #111812 48%, #0b100d 100%);
      color: white;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow: hidden;
    }

    .content {
      width: min(760px, 100%);
      text-align: center;
      position: relative;
      z-index: 5;
    }

    .lights {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .light {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #d7e4da;
      box-shadow: 0 0 12px rgba(215, 228, 218, 0.65);
      animation: glow 1.8s infinite alternate;
    }

    .light:nth-child(2) { animation-delay: .2s; }
    .light:nth-child(3) { animation-delay: .4s; }
    .light:nth-child(4) { animation-delay: .6s; }
    .light:nth-child(5) { animation-delay: .8s; }
    .light:nth-child(6) { animation-delay: 1s; }
    .light:nth-child(7) { animation-delay: 1.2s; }
    .light:nth-child(8) { animation-delay: 1.4s; }

    @keyframes glow {
      from {
        opacity: .45;
        transform: scale(.9);
      }
      to {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .eyebrow {
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #bdc9c1;
      font-weight: bold;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: clamp(52px, 11vw, 100px);
      line-height: .92;
      letter-spacing: -4px;
    }

    .year {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 800;
      margin-bottom: 22px;
    }

    .subtitle {
      max-width: 560px;
      margin: 0 auto;
      color: #aab5ae;
      font-size: 18px;
      line-height: 1.5;
    }

    .open-button {
      display: inline-block;
      margin-top: 32px;
      padding: 16px 25px;
      border-radius: 15px;
      background: #d7e4da;
      color: #101713;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .2s ease, opacity .2s ease;
    }

    .open-button:hover {
      transform: translateY(-3px);
      opacity: .9;
    }

    .decorations {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 38px;
      font-size: 48px;
    }

    .tree {
      animation: float 3s ease-in-out infinite;
    }

    .gift-left {
      animation: float 3.4s ease-in-out infinite;
      animation-delay: .4s;
    }

    .gift-right {
      animation: float 3.2s ease-in-out infinite;
      animation-delay: .8s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .snow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .flake {
      position: absolute;
      top: -20px;
      color: white;
      opacity: .75;
      animation: fall linear infinite;
    }

    .flake:nth-child(1) { left: 5%;  animation-duration: 9s;  animation-delay: 0s;  font-size: 16px; }
    .flake:nth-child(2) { left: 14%; animation-duration: 12s; animation-delay: 2s;  font-size: 11px; }
    .flake:nth-child(3) { left: 24%; animation-duration: 10s; animation-delay: 4s;  font-size: 18px; }
    .flake:nth-child(4) { left: 35%; animation-duration: 13s; animation-delay: 1s;  font-size: 13px; }
    .flake:nth-child(5) { left: 47%; animation-duration: 11s; animation-delay: 3s;  font-size: 17px; }
    .flake:nth-child(6) { left: 59%; animation-duration: 14s; animation-delay: 5s;  font-size: 12px; }
    .flake:nth-child(7) { left: 71%; animation-duration: 9s;  animation-delay: 2s;  font-size: 15px; }
    .flake:nth-child(8) { left: 82%; animation-duration: 12s; animation-delay: 4s;  font-size: 18px; }
    .flake:nth-child(9) { left: 92%; animation-duration: 10s; animation-delay: 1s;  font-size: 12px; }

    @keyframes fall {
      from {
        transform: translateY(-30px) rotate(0deg);
      }
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    .bottom-note {
      margin-top: 25px;
      color: #68756d;
      font-size: 13px;
    }

    @media (prefers-reduced-motion: reduce) {
      .light,
      .tree,
      .gift-left,
      .gift-right,
      .flake {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="snow" aria-hidden="true">
      <div class="flake">❄</div>
      <div class="flake">•</div>
      <div class="flake">❄</div>
      <div class="flake">•</div>
      <div class="flake">❄</div>
      <div class="flake">•</div>
      <div class="flake">❄</div>
      <div class="flake">•</div>
      <div class="flake">❄</div>
    </div>

    <main class="content">

      <div class="lights" aria-hidden="true">
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
      </div>

      <div class="eyebrow">
        🎄 Christmas
      </div>

      <h1>BEN'S</h1>

      <div class="year">
        CHRISTMAS LIST
      </div>

      <p class="subtitle">
        My Christmas wishlist for 2026.
        Tap below to see everything I'm hoping for.
      </p>

      <a class="open-button" href="./wishlist.html">
        🎁 OPEN MY CHRISTMAS LIST →
      </a>

      <div class="decorations" aria-hidden="true">
        <div class="gift-left">🎁</div>
        <div class="tree">🎄</div>
        <div class="gift-right">🎁</div>
      </div>

      <div class="bottom-note">
        Made for Christmas 2026
      </div>

    </main>

  </div>

</body>
</html>
