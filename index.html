<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ben's Christmas List 🎄</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #07101a;
      color: white;
      overflow: hidden;
    }

    /* =====================================
       HOME PAGE
    ===================================== */

    .home {
      position: relative;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at top,
          #20392e 0%,
          #101912 50%,
          #07100b 100%
        );
    }

    .home-content {
      position: relative;
      z-index: 5;

      width: min(850px, 92%);

      text-align: center;

      padding: 40px 20px;

      opacity: 0;
      transform: translateY(25px);
    }

    .home.revealed .home-content {
      animation: revealHome 1.4s ease forwards;
    }

    @keyframes revealHome {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      font-size: 14px;
      letter-spacing: 5px;
      text-transform: uppercase;
      font-weight: bold;

      color: #f2f4f2;

      text-shadow:
        0 3px 15px rgba(0,0,0,.8);
    }

    h1 {
      font-size: clamp(52px, 10vw, 100px);

      line-height: .9;

      margin: 14px 0;

      letter-spacing: -4px;

      text-shadow:
        0 4px 20px rgba(0,0,0,.8),
        0 0 40px rgba(0,0,0,.25);
    }

    .subtitle {
      font-family: Arial, Helvetica, sans-serif;

      max-width: 560px;

      margin: 20px auto 0;

      font-size: 18px;

      line-height: 1.55;

      color: #f0f2ef;

      text-shadow:
        0 3px 15px rgba(0,0,0,.8);
    }

    /* =====================================
       REAL BUTTON
    ===================================== */

    .open-button {
      display: inline-block;

      margin-top: 32px;

      padding: 16px 27px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #871c1f,
          #5f1114
        );

      border: 1px solid rgba(255,255,255,.5);

      color: white;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 16px;

      font-weight: bold;

      text-decoration: none;

      box-shadow:
        0 12px 35px rgba(0,0,0,.4);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .open-button:hover {
      transform: translateY(-4px) scale(1.02);

      box-shadow:
        0 18px 40px rgba(0,0,0,.5);
    }

    /* =====================================
       SNOW ON HOME PAGE
    ===================================== */

    .snow {
      position: absolute;

      inset: 0;

      z-index: 4;

      pointer-events: none;

      overflow: hidden;
    }

    .snowflake {
      position: absolute;

      top: -30px;

      color: white;

      opacity: .75;

      text-shadow:
        0 0 8px rgba(255,255,255,.7);

      animation:
        fall linear infinite,
        drift ease-in-out infinite alternate;
    }

    .snowflake:nth-child(1) {
      left: 4%;
      font-size: 14px;
      animation-duration: 8s, 3s;
    }

    .snowflake:nth-child(2) {
      left: 13%;
      font-size: 9px;
      animation-duration: 11s, 4s;
      animation-delay: 2s;
    }

    .snowflake:nth-child(3) {
      left: 22%;
      font-size: 17px;
      animation-duration: 9s, 3s;
      animation-delay: 1s;
    }

    .snowflake:nth-child(4) {
      left: 34%;
      font-size: 11px;
      animation-duration: 12s, 4s;
      animation-delay: 3s;
    }

    .snowflake:nth-child(5) {
      left: 47%;
      font-size: 15px;
      animation-duration: 10s, 3s;
    }

    .snowflake:nth-child(6) {
      left: 59%;
      font-size: 10px;
      animation-duration: 13s, 4s;
      animation-delay: 2s;
    }

    .snowflake:nth-child(7) {
      left: 71%;
      font-size: 18px;
      animation-duration: 8s, 3s;
      animation-delay: 1s;
    }

    .snowflake:nth-child(8) {
      left: 83%;
      font-size: 12px;
      animation-duration: 11s, 4s;
    }

    .snowflake:nth-child(9) {
      left: 94%;
      font-size: 16px;
      animation-duration: 9s, 3s;
      animation-delay: 2s;
    }

    @keyframes fall {
      from {
        transform: translateY(-30px);
      }

      to {
        transform: translateY(110vh);
      }
    }

    @keyframes drift {
      from {
        margin-left: -15px;
      }

      to {
        margin-left: 18px;
      }
    }

    /* =====================================
       INTRO SCREEN
    ===================================== */

    .intro {
      position: fixed;

      inset: 0;

      z-index: 100;

      overflow: hidden;

      background:
        #07101a
        url("christmas-scene.png")
        center center / cover no-repeat;
    }

    .intro::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(3,8,13,.05),
          rgba(3,8,13,.2),
          rgba(3,8,13,.55)
        );

      z-index: 2;
    }

    /* Slow cinematic camera effect */

    .intro-image {
      position: absolute;

      inset: -5%;

      background:
        url("christmas-scene.png")
        center center / cover no-repeat;

      animation:
        cinematicMove 7s ease-in-out forwards;

      z-index: 1;
    }

    @keyframes cinematicMove {

      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.08);
      }

    }

    /* =====================================
       BLOWING SNOW TRANSITION
    ===================================== */

    .snow-blast {
      position: absolute;

      inset: -20%;

      z-index: 8;

      pointer-events: none;

      opacity: 0;

      background:

        radial-gradient(
          circle at 10% 20%,
          rgba(255,255,255,.95) 0 2px,
          transparent 4px
        ),

        radial-gradient(
          circle at 20% 60%,
          rgba(255,255,255,.85) 0 3px,
          transparent 5px
        ),

        radial-gradient(
          circle at 35% 30%,
          rgba(255,255,255,.95) 0 2px,
          transparent 4px
        ),

        radial-gradient(
          circle at 50% 75%,
          rgba(255,255,255,.9) 0 3px,
          transparent 5px
        ),

        radial-gradient(
          circle at 70% 35%,
          rgba(255,255,255,.95) 0 2px,
          transparent 4px
        ),

        radial-gradient(
          circle at 90% 55%,
          rgba(255,255,255,.9) 0 3px,
          transparent 5px
        );

      background-size:
        130px 110px,
        180px 140px,
        160px 120px,
        220px 160px,
        190px 130px,
        210px 150px;

      animation:
        snowBlast 5.8s ease-out .5s forwards;
    }

    @keyframes snowBlast {

      0% {
        opacity: 0;

        transform:
          translateX(-20%)
          translateY(0)
          scale(1);
      }

      25% {
        opacity: .25;
      }

      55% {
        opacity: .95;

        transform:
          translateX(4%)
          translateY(1%)
          scale(1.1);
      }

      80% {
        opacity: .45;
      }

      100% {
        opacity: 0;

        transform:
          translateX(25%)
          translateY(2%)
          scale(1.18);
      }

    }

    /* =====================================
       INTRO TITLE
    ===================================== */

    .intro-title {
      position: absolute;

      z-index: 7;

      left: 50%;

      bottom: 14%;

      transform: translateX(-50%);

      text-align: center;

      color: white;

      text-shadow:
        0 3px 18px rgba(0,0,0,.9);

      opacity: 0;

      animation:
        titleAppear 1.4s ease 1.5s forwards;
    }

    .intro-title small {

      display: block;

      font-family: Arial, Helvetica, sans-serif;

      text-transform: uppercase;

      letter-spacing: 4px;

      font-size: 11px;

      margin-bottom: 8px;
    }

    .intro-title strong {

      font-size:
        clamp(27px, 6vw, 50px);

      white-space: nowrap;

    }

    @keyframes titleAppear {

      to {
        opacity: 1;
        transform:
          translateX(-50%)
          translateY(-5px);
      }

    }

    /* =====================================
       SKIP BUTTON
    ===================================== */

    .skip-button {

      position: absolute;

      top: 20px;
      right: 20px;

      z-index: 110;

      padding: 9px 13px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.4);

      background:
        rgba(0,0,0,.28);

      color: white;

      font-family: Arial, Helvetica, sans-serif;

      font-weight: bold;

      cursor: pointer;

      backdrop-filter: blur(7px);
    }

    .skip-button:hover {
      background:
        rgba(0,0,0,.48);
    }

    /* =====================================
       INTRO EXIT
    ===================================== */

    .intro.hide {

      animation:
        introExit 1.2s ease forwards;

    }

    @keyframes introExit {

      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

    }

    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 600px) {

      .intro,
      .intro-image {

        background-position:
          60% center;

      }

      h1 {

        letter-spacing:
          -2px;

      }

      .open-button {

        width: 100%;

        max-width: 330px;

      }

      .intro-title strong {

        white-space: normal;

      }

    }

    /* =====================================
       REDUCED MOTION
    ===================================== */

    @media (prefers-reduced-motion: reduce) {

      .intro {
        display: none;
      }

      .home-content {
        opacity: 1;
        transform: none;
      }

      .snowflake,
      .intro-image,
      .snow-blast {
        animation: none;
      }

    }

  </style>
</head>

<body>

  <!-- REAL HOME PAGE -->

  <main class="home" id="home">

    <div class="snow" aria-hidden="true">

      <div class="snowflake">❄</div>
      <div class="snowflake">•</div>
      <div class="snowflake">❄</div>
      <div class="snowflake">•</div>
      <div class="snowflake">❄</div>
      <div class="snowflake">•</div>
      <div class="snowflake">❄</div>
      <div class="snowflake">•</div>
      <div class="snowflake">❄</div>

    </div>


    <div class="home-content">

      <div class="eyebrow">
        Christmas 2026
      </div>

      <h1>
        BEN'S<br>
        CHRISTMAS LIST
      </h1>

      <p class="subtitle">
        My Christmas wishlist for 2026.<br>
        Tap below to see everything I'm hoping for.
      </p>

      <a
        href="./wishlist.html"
        class="open-button"
      >
        🎁 OPEN MY CHRISTMAS LIST →
      </a>

    </div>

  </main>


  <!-- REALISTIC INTRO -->

  <section
    class="intro"
    id="intro"
  >

    <div class="intro-image"></div>

    <div class="intro-title">

      <small>
        A very important delivery
      </small>

      <strong>
        Ben's Christmas List
      </strong>

    </div>

    <div class="snow-blast"></div>

    <button
      class="skip-button"
      id="skipButton"
      type="button"
    >
      Skip Intro
    </button>

  </section>


  <script>

    const intro =
      document.getElementById("intro");

    const home =
      document.getElementById("home");

    const skipButton =
      document.getElementById("skipButton");


    function revealHome() {

      intro.classList.add("hide");

      home.classList.add("revealed");

    }


    /*
      The realistic intro lasts
      about 7 seconds.
    */

    setTimeout(
      revealHome,
      7000
    );


    /*
      Skip button
    */

    skipButton.addEventListener(
      "click",
      revealHome
    );


  </script>

</body>
</html>
