<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ben's Christmas List 🎄</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #2c4435 0%, #111812 48%, #080d0a 100%);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 30px 0 65px;
      overflow: hidden;
    }

    /* Snow */
    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .flake {
      position: absolute;
      top: -40px;
      color: white;
      opacity: 0.7;
      animation: snowFall linear infinite;
      user-select: none;
    }

    .flake:nth-child(1) {
      left: 4%;
      font-size: 17px;
      animation-duration: 8s;
      animation-delay: 0s;
    }

    .flake:nth-child(2) {
      left: 12%;
      font-size: 11px;
      animation-duration: 11s;
      animation-delay: 2s;
    }

    .flake:nth-child(3) {
      left: 22%;
      font-size: 20px;
      animation-duration: 10s;
      animation-delay: 4s;
    }

    .flake:nth-child(4) {
      left: 34%;
      font-size: 13px;
      animation-duration: 13s;
      animation-delay: 1s;
    }

    .flake:nth-child(5) {
      left: 46%;
      font-size: 18px;
      animation-duration: 9s;
      animation-delay: 3s;
    }

    .flake:nth-child(6) {
      left: 58%;
      font-size: 12px;
      animation-duration: 12s;
      animation-delay: 5s;
    }

    .flake:nth-child(7) {
      left: 70%;
      font-size: 19px;
      animation-duration: 8s;
      animation-delay: 2s;
    }

    .flake:nth-child(8) {
      left: 82%;
      font-size: 14px;
      animation-duration: 11s;
      animation-delay: 4s;
    }

    .flake:nth-child(9) {
      left: 94%;
      font-size: 17px;
      animation-duration: 10s;
      animation-delay: 1s;
    }

    @keyframes snowFall {
      0% {
        transform: translateY(-40px) translateX(0) rotate(0deg);
      }

      50% {
        transform: translateY(50vh) translateX(22px) rotate(180deg);
      }

      100% {
        transform: translateY(110vh) translateX(-18px) rotate(360deg);
      }
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 2;
      width: min(1000px, 92%);
      margin: auto;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
      animation: fadeDown 0.7s ease both;
    }

    .home-button {
      display: inline-block;
      padding: 11px 16px;
      border-radius: 12px;
      background: rgba(24, 34, 28, 0.9);
      border: 1px solid #34423a;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }

    .home-button:hover {
      transform: translateY(-2px);
      border-color: #d7e4da;
    }

    .year {
      color: #9eaaa2;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* Christmas lights */
    .lights {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      animation: fadeDown 0.8s ease 0.1s both;
    }

    .light {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #d7e4da;
      box-shadow: 0 0 10px rgba(215, 228, 218, 0.55);
      animation: lightPulse 1.5s infinite alternate;
    }

    .light:nth-child(2) { animation-delay: .15s; }
    .light:nth-child(3) { animation-delay: .30s; }
    .light:nth-child(4) { animation-delay: .45s; }
    .light:nth-child(5) { animation-delay: .60s; }
    .light:nth-child(6) { animation-delay: .75s; }
    .light:nth-child(7) { animation-delay: .90s; }
    .light:nth-child(8) { animation-delay: 1.05s; }

    @keyframes lightPulse {
      from {
        opacity: .4;
        transform: scale(.88);
      }

      to {
        opacity: 1;
        transform: scale(1.18);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 30px;
      animation: headerIn 0.8s ease both;
    }

    .eyebrow {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #bdc9c1;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(42px, 8vw, 72px);
      margin: 9px 0;
      line-height: 1;
    }

    .subtitle {
      color: #aab5ae;
      font-size: 17px;
      margin: 0;
    }

    @keyframes headerIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Price buttons */
    .ranges {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 30px;
      animation: fadeUp 0.8s ease 0.15s both;
    }

    .range-button {
      border: 1px solid #34423a;
      background: rgba(24, 34, 28, 0.92);
      color: white;
      padding: 17px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .range-button:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: #b8c7bc;
    }

    .range-button:active {
      transform: scale(.97);
    }

    .range-button.active {
      background: #d7e4da;
      color: #101713;
      border-color: #d7e4da;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Section title */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 10px;
      margin-bottom: 15px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 26px;
    }

    .count {
      color: #929e96;
      font-size: 14px;
    }

    /* Product cards */
    .items {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .item {
      background: rgba(24, 34, 28, 0.97);
      border: 1px solid #34423a;
      border-radius: 20px;
      padding: 15px;
      overflow: hidden;
      transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
      animation: cardIn 0.5s ease both;
    }

    .item:hover {
      transform: translateY(-6px);
      border-color: #75857a;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.22);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: contain;
      display: block;
      background: white;
      border-radius: 15px;
      margin-bottom: 15px;
      transition: transform .3s ease;
    }

    .item:hover .product-image {
      transform: scale(1.035);
    }

    .item-info {
      padding: 0 3px 3px;
    }

    .item h3 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .price {
      font-weight: bold;
      color: #d7e4da;
    }

    .category {
      color: #929e96;
      font-size: 13px;
      margin-top: 5px;
    }

    .size-badge {
      display: inline-block;
      margin-top: 9px;
      padding: 6px 9px;
      border-radius: 9px;
      background: #253229;
      color: #d7e4da;
      font-size: 12px;
      font-weight: bold;
    }

    .view-button {
      display: inline-block;
      margin-top: 13px;
      padding: 11px 15px;
      border-radius: 11px;
      background: #d7e4da;
      color: #101713;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: .2s;
    }

    .view-button:hover {
      transform: translateY(-2px);
      opacity: .88;
    }

    /* Empty price range */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background: rgba(24, 34, 28, 0.96);
      border: 1px solid #34423a;
      border-radius: 20px;
      animation: cardIn .5s ease both;
    }

    .empty-icon {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .empty strong {
      display: block;
      font-size: 19px;
      margin-bottom: 5px;
    }

    .empty div:last-child {
      color: #929e96;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #68756d;
      margin-top: 42px;
      font-size: 13px;
    }

    /* Floating decorations */
    .decor {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      font-size: 34px;
      opacity: .55;
      animation: floatDecor 4s ease-in-out infinite;
    }

    .decor.tree {
      left: 3%;
      bottom: 8%;
    }

    .decor.gift {
      right: 4%;
      bottom: 12%;
      animation-delay: 1s;
    }

    @keyframes floatDecor {
      0%, 100% {
        transform: translateY(0) rotate(-3deg);
      }

      50% {
        transform: translateY(-13px) rotate(3deg);
      }
    }

    @media (max-width: 700px) {
      .ranges {
        grid-template-columns: repeat(2, 1fr);
      }

      .items {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 260px;
      }

      .decor {
        display: none;
      }
    }

    @media (max-width: 430px) {
      .container {
        width: 94%;
      }

      .ranges {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 225px;
      }

      .top-bar {
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flake,
      .light,
      .item,
      .decor,
      .header,
      .top-bar,
      .lights,
      .ranges {
        animation: none !important;
      }

      .item:hover,
      .range-button:hover,
      .view-button:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="snow" aria-hidden="true">
    <div class="flake">❄</div>
    <div class="flake">•</div>
    <div class="flake">❄</div>
    <div class="flake">•</div>
    <div class="flake">❄</div>
    <div class="flake">•</div>
    <div class="flake">❄</div>
    <div class="flake">•</div>
    <div class="flake">❄</div>
  </div>

  <div class="decor tree" aria-hidden="true">🎄</div>
  <div class="decor gift" aria-hidden="true">🎁</div>

  <div class="container">

    <div class="top-bar">
      <a class="home-button" href="./index.html">
        ← Home
      </a>

      <div class="year">
        Christmas 2026
      </div>
    </div>

    <div class="lights" aria-hidden="true">
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
    </div>

    <div class="header">
      <div class="eyebrow">🎁 My Wishlist</div>

      <h1>Ben's Christmas List</h1>

      <p class="subtitle">
        Tap a price range to explore the list.
      </p>
    </div>

    <div class="ranges">

      <button
        class="range-button active"
        onclick="showItems('under50', this)"
      >
        Under $50
      </button>

      <button
        class="range-button"
        onclick="showItems('50to100', this)"
      >
        $50–$100
      </button>

      <button
        class="range-button"
        onclick="showItems('100plus', this)"
      >
        $100+
      </button>

      <button
        class="range-button"
        onclick="showItems('all', this)"
      >
        Everything
      </button>

    </div>

    <div class="section-title">
      <h2 id="title">Under $50</h2>
      <div class="count" id="count"></div>
    </div>

    <div class="items" id="items"></div>

    <div class="footer">
      🎄 Made for Christmas 2026 🎄
    </div>

  </div>

</div>

<script>

const gifts = [

  {
    name: "Men's PSD",
    price: "Under $50",
    category: "Clothing",
    size: "Men's Medium",
    image: "PSD.avif",
    link: "https://www.target.com/p/psd-men-39-s-2pk-camo-mode-boxer-briefs-urban-camo-blue-camo/-/A-95218636?preselect=95171322#lnk=sametab"
  },

  {
    name: "Jorts",
    price: "Under $50",
    category: "Clothing",
    size: "Medium",
    image: "Jorts.webp",
    link: "https://www.pacsun.com/pacsun/parker-baggy-jean-shorts-light-blue-tint-0170604890030.html?dwvar_0170604890030_color=510"
  },

  {
    name: "Quarter Zip",
    price: "Under $50",
    category: "Clothing",
    size: "Size S",
    image: "Quarter Zip.jpg",
    link: "https://www.amazon.com/JMIERR-Quarter-Pullover-Sweatshirt-Sweater/dp/B0H74RFN74/"
  },

  {
    name: "adidas Handball Spezial",
    price: "$100+",
    category: "Shoes",
    size: "Men's 10",
    image: "samba spezial.webp",
    link: "https://www.adidas.com/us/handball-spezial-shoes/KZ6703.html"
  },

  {
    name: "Nike Dunks",
    price: "$100+",
    category: "Shoes",
    size: "Men's 10",
    image: "Nike Dunks.avif",
    link: "https://www.nike.com/t/dunk-low-retro-mens-shoes-5FQWGR/II7078-200"
  },

  {
    name: "ASICS GEL-KAYANO 14",
    price: "$100+",
    category: "Shoes / Running",
    size: "Men's 10",
    image: "gel kayano 14.webp",
    link: "https://www.asics.com/us/en-us/gel-kayano-14/p/ANA_1203A537-110.html"
  },

  {
    name: "Birkenstock Bostons",
    price: "$100+",
    category: "Shoes",
    size: "Men's 10",
    image: "Birkenstock Bostons.webp",
    link: "https://www.dickssportinggoods.com/p/birkenstock-mens-boston-soft-footbed-casual-shoes-20birmbstnsftftbdfot/20birmbstnsftftbdfot?color=Black"
  }

];


function showItems(range, button) {

  const itemsContainer = document.getElementById("items");
  const title = document.getElementById("title");
  const count = document.getElementById("count");

  document.querySelectorAll(".range-button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  let filteredItems;

  if (range === "all") {

    filteredItems = gifts;
    title.textContent = "Everything";

  } else {

    filteredItems = gifts.filter(item => {

      if (range === "under50") {
        return item.price === "Under $50";
      }

      if (range === "50to100") {
        return item.price === "$50–$100";
      }

      if (range === "100plus") {
        return item.price === "$100+";
      }

      return false;

    });

    if (range === "under50") {
      title.textContent = "Under $50";
    }

    if (range === "50to100") {
      title.textContent = "$50–$100";
    }

    if (range === "100plus") {
      title.textContent = "$100+";
    }

  }


  count.textContent = filteredItems.length + " items";

  itemsContainer.innerHTML = "";


  if (filteredItems.length === 0) {

    itemsContainer.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🎁</div>
        <strong>Nothing here yet</strong>
        <div>Maybe a future addition to the list...</div>
      </div>
    `;

    return;
  }


  filteredItems.forEach((item, index) => {

    const card = document.createElement("div");

    card.className = "item";
    card.style.animationDelay = `${index * 0.08}s`;

    card.innerHTML = `

      <img
        src="${encodeURI(item.image)}"
        alt="${item.name}"
        class="product-image"
      >

      <div class="item-info">

        <h3>${item.name}</h3>

        <div class="price">
          ${item.price}
        </div>

        <div class="category">
          ${item.category}
        </div>

        <div class="size-badge">
          📏 ${item.size}
        </div>

        <br>

        <a
          href="${item.link}"
          target="_blank"
          rel="noopener noreferrer"
          class="view-button"
        >
          View Item →
        </a>

      </div>

    `;

    itemsContainer.appendChild(card);

  });

}


showItems(
  "under50",
  document.querySelector(".range-button")
);

</script>

</body>
</html>
